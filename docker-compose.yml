services:
  kiro-rs:
    image: ${IMAGE_OWNER:-ghcr.io/ykn1002}/kiro-rs:${IMAGE_TAG:-latest}
    container_name: kiro-rs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8990:8990"
    volumes:
      - ./config/:/app/config/
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8990/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
