[package]
name = "kiro-rs-desktop"
version = "2026.8.31"
edition = "2021"
description = "kiro-rs 桌面版"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
kiro-rs = { path = "..", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["clock"] }

# 桌面版打包用 native-tls（native-tls-vendored 静态链接，无动态链接风险）：
# macOS 走 Secure Transport、Windows 走 SChannel，用系统证书栈，代理/证书更稳。
# default 保持 rustls 只为本地 `cargo build` 省依赖；CI 显式传 --features native-tls。
[features]
default = ["rustls"]
rustls = []
native-tls = ["kiro-rs/native-tls"]
